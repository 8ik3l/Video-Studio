name: Build Video Studio
on:
  workflow_dispatch:
  push:
    branches:[main]
jobs:
  build:
    runs-on:ubuntu-latest
    steps:
      - uses:actions/checkout@v4
      - uses:actions/setup-node@v4
        with:{node-version:22,cache:npm}
      - name: Install
        run:npm install
      - name: EAS
        run:npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
